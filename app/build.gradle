plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace "com.youki.dex"
    compileSdk 35

    defaultConfig {
        applicationId "com.youki.dex"
        minSdk 26
        targetSdk 35
        versionCode 3500
        versionName "3.5"
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            // NOTE: "x86" (32-bit) intentionally omitted — matches minSdk 26
            // (Android 8.0+) targeting real devices; 32-bit x86 Android
            // devices are effectively nonexistent among app.build.gradle's
            // actual target audience (emulators use x86_64).
        }
    }

    // One stable key for both variants, supplied by CI (KIT_DEBUG_KEYSTORE
    // secret). Relying on AGP's default ~/.android/debug.keystore was not
    // enough: with the key written there, the APK still came out signed by
    // another certificate. Same key => every new build installs as an update
    // and keeps the grants given on the device.
    def kitKeystore = System.getenv("KIT_DEBUG_KEYSTORE_PATH")

    signingConfigs {
        kitKey {
            if (kitKeystore) {
                storeFile file(kitKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        // ClauDEX: the daily driver. Not debuggable, so ART compiles it with
        // full optimization. Minify stays off on purpose: the freeform launch
        // path depends on reflection (setLaunchWindowingMode, RestrictionBypass)
        // that R8 could strip or rename.
        release {
            applicationIdSuffix ".claudex"
            manifestPlaceholders = [appLabel: "ClauDEX"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (kitKeystore) {
                signingConfig signingConfigs.kitKey
            }
        }
        // ClauDEX debug: installs side by side with the release and is
        // debuggable, which unlocks run-as and heap dumps for profiling.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-kit-debug"
            manifestPlaceholders = [appLabel: "ClauDEX debug"]
            if (kitKeystore) {
                signingConfig signingConfigs.kitKey
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        baseline = file("lint-baseline.xml")
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/LICENSE.md'
            excludes += '/META-INF/LICENSE-notice.md'
            excludes += '/META-INF/DEPENDENCIES'
            excludes += '/META-INF/INDEX.LIST'
            excludes += '/META-INF/io.netty.versions.properties'
            excludes += '/META-INF/logwirez_release.kotlin_module'
            excludes += '/META-INF/*.kotlin_module'
            pickFirst 'META-INF/LICENSE.md'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0-alpha10'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.jaredrummler:colorpicker:1.1.0'

    implementation 'com.github.ChickenHook:RestrictionBypass:2.2'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'

    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-common:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'

    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-video:2.7.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
}
