name: kit-debug APK

# Builds the debuggable, side-by-side variant (applicationId com.youki.dex.debug)
# so it can be profiled on a real device without replacing the official release.
on:
  push:
    branches: [kit-debug]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # A stable debug key, so each new build installs as an UPDATE over the
      # previous one and keeps the grants given on the device. Without the
      # secret the runner makes a random key per run, and every build would
      # need an uninstall. The key stays out of this public repo on purpose:
      # whoever holds it can ship an update that inherits those grants.
      - name: Stable debug signing key
        env:
          KIT_DEBUG_KEYSTORE: ${{ secrets.KIT_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KIT_DEBUG_KEYSTORE" ]; then
            KS="$RUNNER_TEMP/kit-debug.keystore"
            printf '%s' "$KIT_DEBUG_KEYSTORE" | tr -d '\r\n ' | base64 -d > "$KS"
            echo "KIT_DEBUG_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "stable debug key installed at $KS"
            # the certificate fingerprint is public, printing it proves which key signs
            keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | grep -E 'SHA256:'
          else
            echo "::warning::KIT_DEBUG_KEYSTORE secret not set - using a random debug key"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Checksums and signing certificate
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SHA256SUMS
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SIGNER.txt

      - uses: actions/upload-artifact@v4
        with:
          name: youkidex-kit-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/SIGNER.txt
          retention-days: 30
