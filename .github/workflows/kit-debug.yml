name: ClauDEX APKs

# Builds both variants of the fork, signed with the same stable key:
#   release -> com.youki.dex.claudex  "ClauDEX"        (daily driver, not debuggable)
#   debug   -> com.youki.dex.debug    "ClauDEX debug"  (profiling: run-as, heap dumps)
on:
  push:
    branches: [kit-debug]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # A stable key, so each new build installs as an UPDATE over the previous
      # one and keeps the grants given on the device. Without the secret the
      # runner makes a random debug key and the release comes out unsigned.
      # The key stays out of this public repo on purpose: whoever holds it can
      # ship an update that inherits those grants.
      - name: Stable signing key
        env:
          KIT_DEBUG_KEYSTORE: ${{ secrets.KIT_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KIT_DEBUG_KEYSTORE" ]; then
            KS="$RUNNER_TEMP/kit-debug.keystore"
            printf '%s' "$KIT_DEBUG_KEYSTORE" | tr -d '\r\n ' | base64 -d > "$KS"
            echo "KIT_DEBUG_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "stable key installed at $KS"
            # the certificate fingerprint is public, printing it proves which key signs
            keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | grep -E 'SHA256:'
          else
            echo "::warning::KIT_DEBUG_KEYSTORE secret not set - random debug key, unsigned release"
          fi

      - name: Build release and debug
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Collect, checksums and signing certificates
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/claudex-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/claudex-debug.apk
          cd dist
          sha256sum *.apk | tee SHA256SUMS
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in *.apk; do
            echo "== $f" | tee -a SIGNER.txt
            "$APKSIGNER" verify --print-certs "$f" | tee -a SIGNER.txt || echo "UNSIGNED" | tee -a SIGNER.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: claudex
          path: dist/
          retention-days: 30
