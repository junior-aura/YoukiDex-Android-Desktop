name: kit-debug APK

# Builds the debuggable, side-by-side variant (applicationId com.youki.dex.debug)
# so it can be profiled on a real device without replacing the official release.
on:
  push:
    branches: [kit-debug]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Checksums
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee app/build/outputs/apk/debug/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: youkidex-kit-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          retention-days: 30
